name: taskflow
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python tools/init_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: '0'
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "tools/healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '${TASKFLOW_BIND:-127.0.0.1}:${TASKFLOW_PORT:-8088}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
volumes:
  postgres_data:
