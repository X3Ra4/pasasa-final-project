<div class="stats-grid">
<div class="stat"><span>Усього завдань</span><strong>{{ stats.total }}</strong><small>У поточній роботі команди</small></div>
<div class="stat"><span>Активні</span><strong>{{ stats.active }}<i class="stat-dot purple"></i></strong><small>Чекають на наступний крок</small></div>
<div class="stat"><span>Виконано</span><strong>{{ stats.done }}<i class="stat-dot green"></i></strong><small>Кроки, які вже позаду</small></div>
<div class="stat"><span>Прострочено</span><strong>{{ stats.overdue }}<i class="stat-dot orange"></i></strong><small>Потребують вашої уваги</small></div>
</div>
